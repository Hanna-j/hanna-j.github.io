<article><h2>한강 반포에서 동작까지 걷기</h2>
<p>2026-11-23</p>
<p>반포한강공원에서 출발해 강변 산책로를 따라 동작역 방향으로 걸었습니다. 거리는 약 3km이고 천천히 걸으면 50분 정도 걸립니다.</p>
<h3>코스</h3>
<ol><li>반포한강공원 달빛광장</li><li>서래섬</li><li>동작대교 아래</li><li>동작역</li></ol>
<p>서래섬 주변은 길이 넓어서 자전거와 부딪힐 걱정이 적습니다. 해 질 무렵에 가면 강 건너 불빛이 잘 보입니다.</p></article>
